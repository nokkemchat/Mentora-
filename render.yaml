services:
  - type: web
    name: mentora-ingestion-agent
    runtime: docker
    dockerfilePath: mentora-ingestion-agent/Dockerfile
    dockerContext: mentora-ingestion-agent
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
